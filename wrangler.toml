# ============================================
# Worker Mailer - 邮件发送服务
# ============================================

name = "cf-worker-mailer"
main = "src/index.ts"
compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_compat"]

# ------------------------------------------
# 静态资源（前端构建产物）
# ------------------------------------------
[assets]
directory = "./dist"
not_found_handling = "single-page-application"
binding = "ASSETS"
run_worker_first = true

# ------------------------------------------
# D1 数据库（存储所有业务数据）
# ------------------------------------------
[[d1_databases]]
binding = "DB"
database_name = "worker-mailer-db"
database_id = "617b03d0-c1f4-466f-a1b5-ed68260ff0f4"
migrations_dir = "migrations"

# ------------------------------------------
# 环境变量配置
# ------------------------------------------
[vars]
# 可选：指定管理员邮箱，该邮箱注册自动成为管理员
# ADMIN_EMAIL = "admin@example.com"

# ------------------------------------------
# Cloudflare Queues - 邮件异步发送队列
# ------------------------------------------
[queues]
binding = "EMAIL_QUEUE"
queue_name = "cf-worker-mailer-queue"
max_retries = 3

# ------------------------------------------
# Workers 日志和监控
# ------------------------------------------
[observability]
enabled = true
head_sampling_rate = 1

[observability.logs]
enabled = true
head_sampling_rate = 1
persist = true
invocation_logs = true

[observability.traces]
enabled = true
persist = true
head_sampling_rate = 1
